<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匯率查詢與走勢分析系統</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg-base: #0a0d14;
      --bg-card: #121824;
      --bg-card-hover: #1b2333;
      --border-color: #232f46;
      --text-main: #f0f4fc;
      --text-muted: #8b9bb4;
      --accent-blue: #00d2ff;
      --accent-green: #00f2a9;
      --accent-gold: #ffb800;
      --accent-red: #ff5c8a;
      --accent-purple: #c084fc;
      --btn-bg: #1e293b;
      --btn-hover: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .dashboard {
      width: 100%;
      max-width: 1300px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
    }

    header h1 {
      font-size: 1.25rem;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 18px;
      background: var(--accent-blue);
      border-radius: 2px;
    }

    .badge {
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 20px;
      background: #0f2b23;
      color: var(--accent-green);
      font-weight: 500;
      border: 1px solid #184b36;
    }

    /* Tab 導覽列（移至最上方） */
    .tab-navigation {
      display: flex;
      gap: 6px;
      border-bottom: 2px solid var(--border-color);
      overflow-x: auto;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px 8px 0 0;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--accent-blue);
      border-bottom: 2px solid var(--accent-blue);
      background: var(--bg-card);
    }

    /* 單選與多選幣別卡片 */
    .currency-selector-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .selector-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .currency-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* 單選樣式 */
    .circle-radio-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 24px;
      font-size: 0.88rem;
      transition: all 0.2s ease;
      user-select: none;
    }
    .circle-radio-label:hover { border-color: var(--accent-blue); }
    .circle-radio-label input[type="radio"] {
      appearance: none;
      width: 14px;
      height: 14px;
      border: 2px solid var(--text-muted);
      border-radius: 50%;
      outline: none;
      position: relative;
      cursor: pointer;
    }
    .circle-radio-label input[type="radio"]:checked { border-color: var(--accent-blue); }
    .circle-radio-label input[type="radio"]:checked::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--accent-blue);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .circle-radio-label.active {
      border-color: var(--accent-blue);
      background: rgba(0, 210, 255, 0.08);
      color: #fff;
    }

    /* 多選 Checkbox 樣式 */
    .checkbox-pill-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 24px;
      font-size: 0.88rem;
      transition: all 0.2s ease;
      user-select: none;
    }
    .checkbox-pill-label:hover { border-color: var(--accent-blue); }
    .checkbox-pill-label input[type="checkbox"] {
      cursor: pointer;
      accent-color: var(--accent-blue);
      width: 15px;
      height: 15px;
    }
    .checkbox-pill-label.active {
      border-color: var(--accent-blue);
      background: rgba(0, 210, 255, 0.12);
      color: #fff;
    }

    /* 說明橫幅 */
    .info-banner {
      background: rgba(0, 210, 255, 0.05);
      border: 1px dashed rgba(0, 210, 255, 0.3);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 控制面板 */
    .controls {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      align-items: flex-end;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input[type="date"], select {
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    input[type="date"]:focus, select:focus { border-color: var(--accent-blue); }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    button.btn {
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      flex: 1;
      text-align: center;
    }

    button.btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent-blue);
    }

    button.btn.primary { background: #0052cc; border-color: #0065ff; }
    button.btn.primary:hover { background: #0065ff; }
    button.btn.export { background: #113426; border-color: #1b5e3f; color: var(--accent-green); }
    button.btn.export:hover { background: #184b36; }

    /* 單排自適應指標容器 */
    .summary-grid-single-row {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 10px;
      width: 100%;
    }

    .summary-grid-single-row .stat-card {
      flex: 1 1 0;
      min-width: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-align: center;
    }

    .summary-grid-single-row .stat-card .label {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .summary-grid-single-row .stat-card .value {
      font-size: 1.35rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .summary-grid-single-row .stat-card .sub-date {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .quarter-stat-value { color: var(--accent-blue) !important; }

    /* 圖表容器 */
    .chart-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      position: relative;
      height: 420px;
    }

    /* 表格包覆卡片 */
    .matrix-card, .tab1-table-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
    }

    .matrix-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-blue) !important;
      padding: 14px 18px;
      background: #161e2e;
      border-bottom: 1px solid var(--border-color);
    }

    .table-container {
      overflow: auto;
      max-height: 520px;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th {
      background: #161e2e;
      color: var(--text-muted);
      padding: 10px 14px;
      font-weight: 600;
      position: sticky;
      top: 0;
      border-bottom: 2px solid var(--border-color);
      white-space: nowrap;
      z-index: 2;
    }

    td {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
      white-space: nowrap;
    }

    tr:hover td { background: var(--bg-card-hover); }

    /* 年度表格專用 */
    .matrix-table th, .matrix-table td {
      padding: 6px 10px;
      font-size: 0.82rem;
      text-align: right;
    }
    .matrix-table th:first-child, .matrix-table td:first-child {
      text-align: center;
      position: sticky;
      left: 0;
      background: #161e2e;
      font-weight: bold;
      z-index: 3;
    }

    .last-valid-rate { color: var(--accent-gold) !important; font-weight: 700; }
    .matrix-table tbody tr.stat-days-row td { background: #141b29; font-weight: 600; color: var(--text-main); }
    .matrix-table tbody tr.stat-days-row td:first-child { background: #182234; color: var(--accent-blue); }
    .matrix-table tfoot td { font-weight: 600; background: #121b2b; border-top: 1px solid var(--border-color); }
    .matrix-table tfoot tr.highlight-stat td { color: var(--accent-green); }
    .matrix-table tfoot tr.last-year-stat td { color: #b0c4de; }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .tab-content.active { display: flex; }

    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 13, 20, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      font-size: 1.1rem;
      color: var(--accent-blue);
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .summary-grid-single-row { flex-wrap: wrap; }
      .summary-grid-single-row .stat-card { flex: 1 1 45%; }
      .chart-container { height: 300px; }
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="loadingOverlay">讀取匯率資料庫中...</div>

  <div class="dashboard">
    <header>
      <h1>匯率查詢系統</h1>
      <span class="badge" id="dataStatus">檢查資料時間...</span>
    </header>

    <!-- 4 個 Tab 在最頂層 -->
    <div class="tab-navigation">
      <button class="tab-btn active" data-tab="tab1">匯率查詢</button>
      <button class="tab-btn" data-tab="tab2">年度統計</button>
      <button class="tab-btn" data-tab="tab3">指數化走勢</button>
      <button class="tab-btn" data-tab="tab4">累積漲跌幅</button>
    </div>

    <!-- TAB 1: 單一匯率查詢 -->
    <div class="tab-content active" id="tab1">
      <div class="currency-selector-card">
        <span class="selector-title">選擇幣別：</span>
        <div class="currency-group" id="currencyRadioGroupTab1"></div>
      </div>

      <div class="controls">
        <div class="control-group">
          <label>開始日期</label>
          <input type="date" id="tab1StartDate">
        </div>
        <div class="control-group">
          <label>結束日期</label>
          <input type="date" id="tab1EndDate">
        </div>
        <div class="control-group">
          <label>快速選單</label>
          <select id="quickFilter">
            <option value="30">最近 30 日 (預設)</option>
            <option value="90">最近 90 日</option>
            <option value="180">最近 180 日</option>
            <option value="365">最近 1 年</option>
            <option value="all">全部歷史資料</option>
          </select>
        </div>
        <div class="control-group">
          <div class="btn-row">
            <button class="btn primary" id="btnFilterTab1">套用查詢</button>
            <button class="btn export" id="btnExportTab1">下載區間 CSV</button>
          </div>
        </div>
      </div>

      <div class="summary-grid-single-row" id="tab1SummaryGrid"></div>

      <div class="chart-container">
        <canvas id="fxChart"></canvas>
      </div>

      <div class="tab1-table-card">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th id="thCurrencyName">匯率</th>
              </tr>
            </thead>
            <tbody id="tab1TableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TAB 2: 年度統計 -->
    <div class="tab-content" id="tab2">
      <div class="currency-selector-card">
        <span class="selector-title">選擇幣別：</span>
        <div class="currency-group" id="currencyRadioGroupTab2"></div>
      </div>

      <div class="controls">
        <div class="control-group" style="max-width: 250px;">
          <label>選擇年度</label>
          <select id="yearSelector"></select>
        </div>
        <div class="control-group">
          <div class="btn-row" style="max-width: 220px;">
            <button class="btn export" id="btnExportTab2">下載年度報表 CSV</button>
          </div>
        </div>
      </div>

      <div class="summary-grid-single-row" id="tab2QuarterGrid"></div>

      <div class="matrix-card">
        <div class="matrix-title" id="matrixYearTitle">匯率統計表</div>
        <div class="table-container">
          <table class="matrix-table" id="yearMatrixTable">
            <thead>
              <tr>
                <th id="thMatrixYearHeader">年份</th>
                <th>1月</th><th>2月</th><th>3月</th><th>4月</th>
                <th>5月</th><th>6月</th><th>7月</th><th>8月</th>
                <th>9月</th><th>10月</th><th>11月</th><th>12月</th>
              </tr>
            </thead>
            <tbody id="matrixTableBody"></tbody>
            <tfoot id="matrixTableFoot"></tfoot>
          </table>
        </div>
      </div>
    </div>

    <!-- TAB 3: 基期指數化走勢 (Base 100) -->
    <div class="tab-content" id="tab3">
      <div class="currency-selector-card">
        <span class="selector-title">勾選比較幣別 (原始 USD 匯率)：</span>
        <div class="currency-group" id="compareCheckboxGroupTab3"></div>
      </div>

      <div class="info-banner" id="commonPeriodInfoTab3">
        ⓘ 說明：起點日統一指數化為 100。數值 105 代表相較起點美元升值 5%（非美貨幣貶值 5%）。
      </div>

      <div class="controls">
        <div class="control-group">
          <label>共同區間開始</label>
          <input type="date" id="tab3StartDate">
        </div>
        <div class="control-group">
          <label>共同區間結束</label>
          <input type="date" id="tab3EndDate">
        </div>
        <div class="control-group">
          <label>快速區間縮小</label>
          <select id="tab3QuickFilter">
            <option value="all">全部共同重疊期間</option>
            <option value="365">最近 1 年</option>
            <option value="1095">最近 3 年</option>
            <option value="1825">最近 5 年</option>
          </select>
        </div>
        <div class="control-group">
          <div class="btn-row">
            <button class="btn primary" id="btnFilterTab3">套用區間</button>
            <button class="btn export" id="btnExportTab3">下載比較 CSV</button>
          </div>
        </div>
      </div>

      <div class="chart-container" style="height: 480px;">
        <canvas id="indexedChart"></canvas>
      </div>
    </div>

    <!-- TAB 4: 累積漲跌幅百分比走勢 (%) -->
    <div class="tab-content" id="tab4">
      <div class="currency-selector-card">
        <span class="selector-title">勾選比較幣別 (原始 USD 匯率)：</span>
        <div class="currency-group" id="compareCheckboxGroupTab4"></div>
      </div>

      <div class="info-banner" id="commonPeriodInfoTab4">
        ⓘ 說明：以起點日為 0%，顯示各幣別對美元累計升貶幅。正值代表該匯率上升（美元走強），負值代表匯率下降。
      </div>

      <div class="controls">
        <div class="control-group">
          <label>共同區間開始</label>
          <input type="date" id="tab4StartDate">
        </div>
        <div class="control-group">
          <label>共同區間結束</label>
          <input type="date" id="tab4EndDate">
        </div>
        <div class="control-group">
          <label>快速區間縮小</label>
          <select id="tab4QuickFilter">
            <option value="all">全部共同重疊期間</option>
            <option value="365">最近 1 年</option>
            <option value="1095">最近 3 年</option>
            <option value="1825">最近 5 年</option>
          </select>
        </div>
        <div class="control-group">
          <div class="btn-row">
            <button class="btn primary" id="btnFilterTab4">套用區間</button>
            <button class="btn export" id="btnExportTab4">下載比較 CSV</button>
          </div>
        </div>
      </div>

      <div class="chart-container" style="height: 480px;">
        <canvas id="pctChangeChart"></canvas>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
